name: UNLEASHED iOS game launch candidate
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: unleashed-ios-game
  cancel-in-progress: false
jobs:
  build:
    runs-on: macos-15-intel
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: vittorioromeo/quakevr
          ref: 9192b03797cfa3a724d1f71c4b42609ff52865a4
          path: engine
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: libsdl-org/SDL
          ref: 5d249570393f7a37e037abf22cd6012a4cc56a71
          path: SDL
          persist-credentials: false
      - name: Apply isolated iOS adapter
        run: |
          git -C engine apply ../ports/ios/game/engine.patch
          mkdir -p engine/ports/ios
          cp -R ports/ios/game engine/ports/ios/game
      - name: Fetch verified native libraries
        run: |
          curl --fail --location --retry 2 --max-time 180 https://github.com/thebcd69/bcd-games/releases/download/v0.1.653/BCD.ipa -o "$RUNNER_TEMP/native-donor.ipa"
          python3 ports/ios/probe/extract_inputs.py "$RUNNER_TEMP/native-donor.ipa" "$RUNNER_TEMP/native-inputs"
      - name: Focused native touch controller fixture
        run: |
          # Test the same pinned SDL2 as the app, not Homebrew SDL2-on-SDL3 compatibility.
          cmake -S SDL -B "$RUNNER_TEMP/host-sdl" -DCMAKE_BUILD_TYPE=Release -DSDL_SHARED=ON -DSDL_STATIC=OFF -DSDL_TEST=OFF -DCMAKE_INSTALL_PREFIX="$RUNNER_TEMP/host-sdl-install"
          cmake --build "$RUNNER_TEMP/host-sdl" --parallel 3
          cmake --install "$RUNNER_TEMP/host-sdl"
          cc ports/ios/game/test_touch_overlay.c $("$RUNNER_TEMP/host-sdl-install/bin/sdl2-config" --cflags --libs) -Wl,-rpath,"$RUNNER_TEMP/host-sdl-install/lib" -lm -o "$RUNNER_TEMP/touch-fixture"
          SDL_VIDEODRIVER=dummy QVR_TOUCH_PREVIEW="$RUNNER_TEMP/touch-preview.bmp" "$RUNNER_TEMP/touch-fixture"
      - uses: actions/upload-artifact@v4
        with:
          name: Touch-glyph-preview
          path: ${{ runner.temp }}/touch-preview.bmp
          if-no-files-found: error
      - name: Focused phone UI migration
        run: python3 ports/ios/game/test_ui_migration.py "$GITHUB_WORKSPACE/engine"
      - name: Flat profile source contracts
        run: python3 ports/ios/game/test_flat_profile.py "$GITHUB_WORKSPACE/engine"
      - name: Compile real engine without retail data
        run: bash ports/ios/game/build_game.sh "$GITHUB_WORKSPACE/engine" "$GITHUB_WORKSPACE/SDL" "$RUNNER_TEMP/native-inputs" "$RUNNER_TEMP/game-output"
      - uses: actions/upload-artifact@v4
        with:
          name: Unleashed-launch-candidate
          path: ${{ runner.temp }}/game-output/Unleashed-launch-candidate.ipa
          if-no-files-found: error
          retention-days: 7
